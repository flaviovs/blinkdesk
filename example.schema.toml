# BlinkDesk Schema Example
# 
# This is a simple Kanban-style workflow: TODO -> IN_PROGRESS -> DONE
# Copy this file and customize it for your needs.

# =============================================================================
# SCHEMA
# =============================================================================
# Workflow definition: entities, states, priorities, and transitions.

[schema]

# =============================================================================
# ENTITIES
# =============================================================================
# Entities are the people or teams who can own and interact with tickets.
# Each entity is identified by a unique slug.

entities = ["alice", "bob", "charlie"]

# =============================================================================
# STATES
# =============================================================================
# States represent the stages a ticket can be in. Design these to match
# your workflow. Simple workflows might have 3 states, complex ones might
# have 6-10.

states = ["todo", "in_progress", "done"]

# =============================================================================
# PRIORITIES
# =============================================================================
# Priorities define the urgency of tickets. Each priority is identified by a slug.
# If not specified, defaults to "normal".

priorities = ["low", "normal", "high"]

# =============================================================================
# CATEGORIES
# =============================================================================
# Categories are optional labels that group tickets.
# Keep empty if you don't need categories initially.

categories = []

# =============================================================================
# TRANSITIONS
# =============================================================================
# Transitions define which state changes are allowed. Without a transition
# defined, a state change will be rejected.

transitions = [
    { from = "todo", to = "in_progress" },
    { from = "todo", to = "done" },
    { from = "in_progress", to = "todo" },
    { from = "in_progress", to = "done" },
]

# =============================================================================
# OPTIONS
# =============================================================================
# Optional runtime options for system behavior.

[options]
# Prefix shown before ticket IDs when displaying (e.g., "#42" or "TICKET-42")
display_prefix = "#"

# If true, prevents creating new entities via API/CLI after initial setup.
# Set to true for fixed teams, false for dynamic environments.
lock_entities = false

# Default priority for new tickets (if not specified at creation time)
default_priority = "normal"
